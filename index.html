<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생각의 크기</title>

<style>

body{
	margin:0px;
	overflow:hidden;
	background:black;
	color:white;
	font-family:Arial, sans-serif;
}

#placeBackground{
	position:absolute;
	top:0px;
	left:0px;
	width:100vw;
	height:100vh;
	opacity:0;
}

#title{
	position:absolute;
	top:32px;
	left:40px;
	font-size:64px;
	margin:0px;
}

#headArea{
	position:absolute;
	top:-8vh;
	right:0px;
	width:120vh;
	height:120vh;
}

#head{
	position:absolute;
	top:0px;
	left:0px;
	width:100%;
	height:100%;
}

#bubble1{
	position:absolute;
	top:12%;
	left:31%;
	width:23%;
	height:23%;
	background:white;
	border:3px solid black;
	border-radius:50%;
	color:black;
	text-align:center;
	display:flex;
	align-items:center;
	justify-content:center;
	font-size:1.7vh;
}

#bubble2{
	position:absolute;
	top:13%;
	left:57%;
	width:18%;
	height:18%;
	background:white;
	border:1px solid #999999;
	border-radius:50%;
	color:black;
	text-align:center;
	display:flex;
	align-items:center;
	justify-content:center;
	font-size:1.7vh;
}

#bubble3{
	position:absolute;
	top:27%;
	left:65%;
	width:15%;
	height:15%;
	background:white;
	border:1px solid #999999;
	border-radius:50%;
	color:black;
	text-align:center;
	display:flex;
	align-items:center;
	justify-content:center;
	font-size:1.7vh;
}

#bubble4{
	position:absolute;
	top:34%;
	left:80%;
	width:10.5%;
	height:16.8%;
	background:white;
	border:1px solid #999999;
	border-radius:50%;
	color:black;
	text-align:center;
	display:flex;
	align-items:center;
	justify-content:center;
	font-size:1.7vh;
}

#bubble5{
	position:absolute;
	top:34%;
	left:45%;
	width:20.8%;
	height:10.4%;
	background:white;
	border:1px solid #999999;
	border-radius:50%;
	color:black;
	text-align:center;
	display:flex;
	align-items:center;
	justify-content:center;
	font-size:1.7vh;
}


#nameArea{
	position:absolute;
	top:110px;
	left:40px;
	width:240px;
}

#nameInput{
	width:220px;
	height:28px;
	font-size:16px;
}

#controls{
	position:absolute;
	left:40px;
	bottom:40px;
	width:300px;
}

.label{
	margin:20px 0px 8px 0px;
	font-size:13px;
}

#thoughtInput{
	width:290px;
	height:28px;
	font-size:16px;
}

#sizeSlider{
	width:300px;
}

.place{
	width:70px;
	height:32px;
	background:white;
	opacity:0.6;
}

#placeBasic{
	opacity:1;
}

#resetButton{
	margin-top:20px;
	width:300px;
	height:36px;
	background:white;
}

</style>
</head>

<body>

<img src="subway.jpg" id="placeBackground">


<div id="headArea">

	<img src="head_new.png" id="head">

	<div id="bubble1">생각 1</div>

	<div id="bubble2">생각 2</div>

	<div id="bubble3">생각 3</div>

	<div id="bubble4">생각 4</div>

	<div id="bubble5">생각 5</div>

</div>


<h1 id="title">(   )의 머릿속</h1>


<div id="nameArea">

	<p>누구의 머릿속인가요?</p>

	<input type="text" id="nameInput">

</div>


<div id="controls">

	<p class="label">지금 무슨 생각을 하고 있나요?</p>
	<input type="text" id="thoughtInput">

	<p class="label">이 생각이 머릿속을 얼마나 차지하고 있나요?</p>
	<input type="range" id="sizeSlider" min="8" max="28" value="23" step="0.5">

	<p class="label">이 생각은 어떤 색인가요?</p>
	<input type="color" id="colorInput" value="#ffffff">

	<p class="label">지금 어디에 있나요?</p>

	<button class="place" id="placeBasic">기본</button>
	<button class="place" id="placeSubway">지하철</button>
	<button class="place" id="placeClass">교실</button>
	<button class="place" id="placeAlley">골목길</button>

	<button id="resetButton">처음으로 되돌리기</button>

</div>


<audio src="subway.mp3" id="subwaySound" loop></audio>
<audio src="classroom.mp3" id="classSound" loop></audio>
<audio src="alley.mp3" id="alleySound" loop></audio>


<script>


let selected = "bubble1";


let size1 = 23;
let size2 = 18;
let size3 = 15;
let size4 = 14;
let size5 = 16;


let color1 = "#ffffff";
let color2 = "#ffffff";
let color3 = "#ffffff";
let color4 = "#ffffff";
let color5 = "#ffffff";


let subwayOn = "no";
let classOn = "no";
let alleyOn = "no";



bubble1.onclick = function(){

	selected = "bubble1";

	bubble1.style.border = "3px solid black";
	bubble2.style.border = "1px solid #999999";
	bubble3.style.border = "1px solid #999999";
	bubble4.style.border = "1px solid #999999";
	bubble5.style.border = "1px solid #999999";

	sizeSlider.value = size1;
	colorInput.value = color1;

};



bubble2.onclick = function(){

	selected = "bubble2";

	bubble1.style.border = "1px solid #999999";
	bubble2.style.border = "3px solid black";
	bubble3.style.border = "1px solid #999999";
	bubble4.style.border = "1px solid #999999";
	bubble5.style.border = "1px solid #999999";

	sizeSlider.value = size2;
	colorInput.value = color2;

};



bubble3.onclick = function(){

	selected = "bubble3";

	bubble1.style.border = "1px solid #999999";
	bubble2.style.border = "1px solid #999999";
	bubble3.style.border = "3px solid black";
	bubble4.style.border = "1px solid #999999";
	bubble5.style.border = "1px solid #999999";

	sizeSlider.value = size3;
	colorInput.value = color3;

};



bubble4.onclick = function(){

	selected = "bubble4";

	bubble1.style.border = "1px solid #999999";
	bubble2.style.border = "1px solid #999999";
	bubble3.style.border = "1px solid #999999";
	bubble4.style.border = "3px solid black";
	bubble5.style.border = "1px solid #999999";

	sizeSlider.value = size4;
	colorInput.value = color4;

};



bubble5.onclick = function(){

	selected = "bubble5";

	bubble1.style.border = "1px solid #999999";
	bubble2.style.border = "1px solid #999999";
	bubble3.style.border = "1px solid #999999";
	bubble4.style.border = "1px solid #999999";
	bubble5.style.border = "3px solid black";

	sizeSlider.value = size5;
	colorInput.value = color5;

};


nameInput.oninput = function(){

	if(nameInput.value == ""){

		title.innerHTML = "(   )의 머릿속";

	}else{

		title.innerHTML = nameInput.value + "의 머릿속";

	}

};



thoughtInput.oninput = function(){

	if(selected == "bubble1"){

		bubble1.innerHTML = thoughtInput.value;

	}else if(selected == "bubble2"){

		bubble2.innerHTML = thoughtInput.value;

	}else if(selected == "bubble3"){

		bubble3.innerHTML = thoughtInput.value;

	}else if(selected == "bubble4"){

		bubble4.innerHTML = thoughtInput.value;

	}else if(selected == "bubble5"){

		bubble5.innerHTML = thoughtInput.value;

	}

};



sizeSlider.oninput = function(){

	if(selected == "bubble1"){

		bubble1.style.width = sizeSlider.value + "%";
		bubble1.style.height = sizeSlider.value + "%";

		size1 = 23;

	}else if(selected == "bubble2"){

		bubble2.style.width = sizeSlider.value + "%";
		bubble2.style.height = sizeSlider.value + "%";

		size2 = 18;

	}else if(selected == "bubble3"){

		bubble3.style.width = sizeSlider.value + "%";
		bubble3.style.height = sizeSlider.value + "%";

		size3 = 15;

	}else if(selected == "bubble4"){

		bubble4.style.width = (sizeSlider.value * 0.75) + "%";
		bubble4.style.height = (sizeSlider.value * 1.2) + "%";

		size4 = 14;

	}else if(selected == "bubble5"){

		bubble5.style.width = (sizeSlider.value * 1.3) + "%";
		bubble5.style.height = (sizeSlider.value * 0.65) + "%";

		size5 = 16;

	}

};



colorInput.oninput = function(){

	if(selected == "bubble1"){

		bubble1.style.background = colorInput.value;
		color1 = colorInput.value;

	}else if(selected == "bubble2"){

		bubble2.style.background = colorInput.value;
		color2 = colorInput.value;

	}else if(selected == "bubble3"){

		bubble3.style.background = colorInput.value;
		color3 = colorInput.value;

	}else if(selected == "bubble4"){

		bubble4.style.background = colorInput.value;
		color4 = colorInput.value;

	}else if(selected == "bubble5"){

		bubble5.style.background = colorInput.value;
		color5 = colorInput.value;

	}

};



placeBasic.onclick = function(){

	placeBackground.style.opacity = "0";

	subwaySound.pause();
	classSound.pause();
	alleySound.pause();

	subwayOn = "no";
	classOn = "no";
	alleyOn = "no";

	placeBasic.style.opacity = "1";
	placeSubway.style.opacity = "0.6";
	placeClass.style.opacity = "0.6";
	placeAlley.style.opacity = "0.6";

};



placeSubway.onclick = function(){

	if(subwayOn == "no"){

		placeBackground.src = "subway.jpg";
		placeBackground.style.opacity = "1";

		subwaySound.play();
		classSound.pause();
		alleySound.pause();

		subwayOn = "yes";
		classOn = "no";
		alleyOn = "no";

		placeBasic.style.opacity = "0.6";
		placeSubway.style.opacity = "1";
		placeClass.style.opacity = "0.6";
		placeAlley.style.opacity = "0.6";

	}else if(subwayOn == "yes"){

		placeBackground.style.opacity = "0";

		subwaySound.pause();

		subwayOn = "no";

		placeBasic.style.opacity = "1";
		placeSubway.style.opacity = "0.6";

	}

};



placeClass.onclick = function(){

	if(classOn == "no"){

		placeBackground.src = "classroom.jpg";
		placeBackground.style.opacity = "1";

		subwaySound.pause();
		classSound.play();
		alleySound.pause();

		subwayOn = "no";
		classOn = "yes";
		alleyOn = "no";

		placeBasic.style.opacity = "0.6";
		placeSubway.style.opacity = "0.6";
		placeClass.style.opacity = "1";
		placeAlley.style.opacity = "0.6";

	}else if(classOn == "yes"){

		placeBackground.style.opacity = "0";

		classSound.pause();

		classOn = "no";

		placeBasic.style.opacity = "1";
		placeClass.style.opacity = "0.6";

	}

};



placeAlley.onclick = function(){

	if(alleyOn == "no"){

		placeBackground.src = "alley.jpg";
		placeBackground.style.opacity = "1";

		subwaySound.pause();
		classSound.pause();
		alleySound.play();

		subwayOn = "no";
		classOn = "no";
		alleyOn = "yes";

		placeBasic.style.opacity = "0.6";
		placeSubway.style.opacity = "0.6";
		placeClass.style.opacity = "0.6";
		placeAlley.style.opacity = "1";

	}else if(alleyOn == "yes"){

		placeBackground.style.opacity = "0";

		alleySound.pause();

		alleyOn = "no";

		placeBasic.style.opacity = "1";
		placeAlley.style.opacity = "0.6";

	}

};

resetButton.onclick = function(){

	selected = "bubble1";

	bubble1.innerHTML = "생각 1";
	bubble2.innerHTML = "생각 2";
	bubble3.innerHTML = "생각 3";
	bubble4.innerHTML = "생각 4";
	bubble5.innerHTML = "생각 5";

	bubble1.style.width = "23%";
	bubble1.style.height = "23%";

	bubble2.style.width = "18%";
	bubble2.style.height = "18%";

	bubble3.style.width = "15%";
	bubble3.style.height = "15%";

	bubble4.style.width = "10.5%";
	bubble4.style.height = "16.8%";

	bubble5.style.width = "20.8%";
	bubble5.style.height = "10.4%";

	bubble1.style.background = "white";
	bubble2.style.background = "white";
	bubble3.style.background = "white";
	bubble4.style.background = "white";
	bubble5.style.background = "white";

	bubble1.style.border = "3px solid black";
	bubble2.style.border = "1px solid #999999";
	bubble3.style.border = "1px solid #999999";
	bubble4.style.border = "1px solid #999999";
	bubble5.style.border = "1px solid #999999";

	size1 = 23;
	size2 = 18;
	size3 = 15;
	size4 = 14;
	size5 = 16;

	color1 = "#ffffff";
	color2 = "#ffffff";
	color3 = "#ffffff";
	color4 = "#ffffff";
	color5 = "#ffffff";

	title.innerHTML = "(   )의 머릿속";

	nameInput.value = "";
	thoughtInput.value = "";
	sizeSlider.value = 23;
	colorInput.value = "#ffffff";

	placeBackground.style.opacity = "0";

	subwaySound.pause();
	classSound.pause();
	alleySound.pause();

	subwayOn = "no";
	classOn = "no";
	alleyOn = "no";

	placeBasic.style.opacity = "1";
	placeSubway.style.opacity = "0.6";
	placeClass.style.opacity = "0.6";
	placeAlley.style.opacity = "0.6";

};

</script>

</body>
</html>
